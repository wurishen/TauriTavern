name: Unsigned iOS IPA

# Sideload build for personal signing. Needs no Apple secrets, so it is kept
# separate from the signed Canary/TestFlight pipeline in canary-release.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: unsigned-ios-ipa-${{ inputs.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: latest-known

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

  build:
    name: unsigned-ios-ipa
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Allow plain HTTP for sideloaded local endpoints
        run: ./scripts/ci/configure-mobile-http.sh enable ios

      # The committed Xcode project pins a signing identity, so xcodebuild would
      # demand an Apple account before it emits a bundle.
      - name: Drop the code signing requirement
        run: ./scripts/ci/configure-ios-signing.sh enable

      # `tauri ios build` always finishes with a signed export, which needs an
      # Apple account. Drive the same xcodebuild invocation Tauri uses for the
      # bundle and stop there; the Build Rust Code phase still compiles the app.
      - name: Build frontend bundle
        run: node scripts/tauri-before-build.mjs

      - name: Build unsigned iOS bundle
        env:
          TAURITAVERN_SKIP_WEB_BUILD: "1"
        run: |
          set -euo pipefail
          xcodebuild \
            -allowProvisioningUpdates \
            -scheme tauritavern_iOS \
            -workspace src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj/project.xcworkspace/ \
            -sdk iphoneos \
            -configuration release \
            -derivedDataPath "${RUNNER_TEMP}/derived-data" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          products="${RUNNER_TEMP}/derived-data/Build/Products/Release-iphoneos"
          app="$(find "${products}" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [[ -z "${app}" ]]; then
            echo "no .app was produced in ${products}" >&2
            ls -la "${products}" >&2 || true
            exit 1
          fi
          echo "packaging ${app}"
          staging="${RUNNER_TEMP}/unsigned-ipa"
          rm -rf "${staging}"
          mkdir -p "${staging}/Payload"
          cp -R "${app}" "${staging}/Payload/"
          (cd "${staging}" && zip -qry "${GITHUB_WORKSPACE}/TauriTavern-unsigned.ipa" Payload)
          ls -lh "${GITHUB_WORKSPACE}/TauriTavern-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-unsigned-ios-ipa
          path: TauriTavern-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
